# Reusable workflow: builds an app's Linux desktop bundle on an x86_64 runner
# and proves the binary launches and renders under a headless X server.
#
# The runner is ubuntu-24.04, an x86_64 image, so `flutter build linux`
# produces a genuine x86_64 bundle. The verification launches that bundle under
# Xvfb with software rendering, waits for the GTK window to map, and captures
# a screenshot, so a broken renderer or a missing shared library fails the job
# instead of shipping.
name: Linux x86_64 build and verification

on:
  workflow_call:
    inputs:
      app_dir:
        description: Directory that holds pubspec.yaml.
        type: string
        required: true
      binary:
        description: Name of the Linux executable inside the release bundle.
        type: string
        required: true
      window_title:
        description: Expected window title of the running app.
        type: string
        default: ''
      artifact_name:
        description: Name of the uploaded build artifact.
        type: string
        default: 'linux-x64-bundle'
      repository:
        description: Repository to check out; empty means the caller.
        type: string
        default: ''
      journey_script:
        description: Path of the app's own Linux desktop journey script.
        type: string
        default: ''
    secrets:
      app_repo_token:
        description: Token with access to the app and to the private packages.
        required: false
  workflow_dispatch:
    inputs:
      app_dir: {type: string, default: 'probe_app'}
      binary: {type: string, default: 'ci_probe'}
      window_title: {type: string, default: 'ci_probe'}
      artifact_name: {type: string, default: 'ci-probe-linux-x64'}
      repository: {type: string, default: ''}
      journey_script: {type: string, default: ''}

permissions:
  contents: read

jobs:
  verify:
    name: Build and launch on x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_DIR: '${{ inputs.app_dir }}'
      BINARY: '${{ inputs.binary }}'
      WINDOW_TITLE: '${{ inputs.window_title }}'
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          token: ${{ secrets.app_repo_token != '' && secrets.app_repo_token || secrets.APP_REPO_TOKEN != '' && secrets.APP_REPO_TOKEN || github.token }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install the Linux desktop toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # A few plugins need packages that live in the universe component,
          # which the runner image does not enable by default.
          echo "deb http://archive.ubuntu.com/ubuntu noble universe" | \
            sudo tee /etc/apt/sources.list.d/universe.list >/dev/null
          sudo apt-get update -o Dpkg::Options::=--force-confnew
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confnew \
            dbus-x11 gnome-keyring
          sudo apt-get update -o Dpkg::Options::=--force-confnew
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev zlib1g-dev libsecret-1-dev \
            libgl1 libglu1-mesa libepoxy-dev \
            xvfb openbox x11-utils xdotool ffmpeg imagemagick
          # Only needed by the media plugins, and not by every app.
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            || echo "the media development packages are unavailable here"

      - name: Authorise git for the private package repositories
        env:
          PACKAGE_TOKEN: ${{ secrets.app_repo_token != '' && secrets.app_repo_token || secrets.APP_REPO_TOKEN != '' && secrets.APP_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The apps depend on private packages that are fetched by URL, so the
          # clone needs credentials of its own.
          git config --global url."https://x-access-token:${PACKAGE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Fetch the packages
        working-directory: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}
        run: flutter pub get

      - name: Build the Linux release bundle
        working-directory: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}
        run: flutter build linux --release

      - name: Confirm the bundle is an x86_64 build
        working-directory: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}
        run: |
          set -euo pipefail
          binary="build/linux/x64/release/bundle/$BINARY"
          test -x "$binary"
          file "$binary" | tee bundle-type.txt
          grep -q 'x86-64' bundle-type.txt

      - name: Launch the bundle headlessly and capture the screen
        working-directory: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}
        run: |
          set -euo pipefail
          bundle="build/linux/x64/release/bundle"
          export DISPLAY=:99
          # A desktop session has a secret service for the keyring; the apps read
          # their session from it, so the runner needs one as well.
          eval "$(dbus-launch --sh-syntax)"
          gnome-keyring-daemon --start --foreground --components=secrets >/tmp/keyring.log 2>&1 &
          sleep 3
          printf 'audit\n' | gnome-keyring-daemon --unlock >/dev/null 2>&1 || true
          # Unlocking a fresh keyring leaves it without the default collection,
          # which the apps look for; storing one creates it.
          printf 'bootstrap' | secret-tool store --label='linux audit bootstrap' audit bootstrap >/dev/null 2>&1 || true
          Xvfb :99 -screen 0 1440x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          openbox --sm-disable >/tmp/openbox.log 2>&1 &
          sleep 2
          export FLUTTER_ENGINE_SWITCHES=2
          export FLUTTER_ENGINE_SWITCH_1=enable-software-rendering=true
          export FLUTTER_ENGINE_SWITCH_2=enable-impeller=false
          ( cd "$bundle" && exec "./$BINARY" ) >/tmp/app.log 2>&1 &
          app_pid=$!
          window=""
          for _ in $(seq 1 90); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "the app exited before it drew a window" >&2
              cat /tmp/app.log >&2
              exit 1
            fi
            if [ -n "$WINDOW_TITLE" ]; then
              window=$(xdotool search --onlyvisible --name "$WINDOW_TITLE" 2>/dev/null | head -1 || true)
            else
              window=$(xdotool search --onlyvisible --name '.' 2>/dev/null | head -1 || true)
            fi
            [ -n "$window" ] && break
            sleep 2
          done
          if [ -z "$window" ]; then
            echo "no window appeared for the app" >&2
            xwininfo -root -tree >&2 || true
            cat /tmp/app.log >&2
            exit 1
          fi
          echo "window=$window title=$(xdotool getwindowname "$window")"
          xdotool windowactivate "$window" || true
          sleep 4
          mkdir -p verification
          ffmpeg -y -loglevel error -f x11grab -video_size 1440x900 -i :99 -frames:v 1 \
            "verification/${BINARY}-signin.png"
          identify -format 'colors=%k mean=%[fx:mean]\n' "verification/${BINARY}-signin.png" | tee verification/image-stats.txt
          colors=$(sed -n 's/.*colors=\([0-9]*\).*/\1/p' verification/image-stats.txt)
          if [ "${colors:-0}" -lt 20 ]; then
            echo "the window rendered a blank screen" >&2
            exit 1
          fi
          kill "$app_pid" 2>/dev/null || true

      - name: Run the app's own Linux desktop journey
        if: ${{ inputs.journey_script != '' }}
        working-directory: ${{ github.workspace }}
        env:
          JOURNEY_SCRIPT: '${{ inputs.journey_script }}'
        run: |
          set -euo pipefail
          # The journey starts its own screen, bus, database and server, and
          # signs in with a real account, so the desktop path is proved and not
          # only its first screen.
          sudo apt-get install -y --no-install-recommends \
            xdg-desktop-portal xdg-desktop-portal-gtk || true
          sudo systemctl start postgresql || true
          sudo -u postgres psql -tc \
            "SELECT 1 FROM pg_roles WHERE rolname='$(whoami)'" | grep -q 1 \
            || sudo -u postgres psql -c "CREATE ROLE $(whoami) SUPERUSER LOGIN;"
          if [ -f server/package.json ]; then
            ( cd server && ( npm ci --no-audit --no-fund || npm install --no-audit --no-fund ) )
          fi
          chmod +x "$JOURNEY_SCRIPT"
          export LOG="$GITHUB_WORKSPACE/journey.log"
          "./$JOURNEY_SCRIPT" || status=$?
          if [ -f "$LOG" ]; then
            tail -n 200 "$LOG" || true
          fi
          exit "${status:-0}"

      - name: Upload the x86_64 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ inputs.artifact_name }}'
          path: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}/build/linux/x64/release/bundle
          retention-days: 14

      - name: Upload the verification screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: '${{ inputs.artifact_name }}-screenshot'
          path: ${{ inputs.app_dir == '.' && github.workspace || format('{0}/{1}', github.workspace, inputs.app_dir) }}/verification
          retention-days: 14
