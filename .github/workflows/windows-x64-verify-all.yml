# Build, launch-verify and publish Windows x64 binaries for the whole Office suite.
# Runs from this public repository, so hosted-runner minutes are free. The
# private app source is checked out with APP_REPO_TOKEN.
#
# Each app that has a Windows dashboard journey gets a per-app PowerShell
# script in journeys/ that starts the local backend, seeds a test admin and
# runs the app's Windows integration test until the dashboard is on screen.
name: Windows x64 verify (all private apps)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload each verified binary to the Office One downloads directory
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.app }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - app: office_one
            app_dir: '.'
            binary: office_one
            window_title: Office One
            slug: one
          - app: office_mail
            app_dir: 'app'
            binary: office_mail
            window_title: Office Mail
            slug: mail
            journey_script: 'journeys/mail.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_document_editor
            app_dir: 'app'
            binary: office_docs
            window_title: Office Docs
            slug: docs
            journey_script: 'journeys/docs.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_sheet_editor
            app_dir: 'app'
            binary: office_sheets
            window_title: Office Sheets
            slug: sheets
            journey_script: 'journeys/sheets.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_presentation_editor
            app_dir: 'app'
            binary: office_slides
            window_title: Office Slides
            slug: slides
            journey_script: 'journeys/slides.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_pdf_editor
            app_dir: 'app'
            binary: office_pdf
            window_title: Office PDF
            slug: pdf
            journey_script: 'journeys/pdf.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_sign
            app_dir: 'app'
            binary: office_sign
            window_title: Office Sign
            slug: sign
            journey_script: 'journeys/sign.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_drive
            app_dir: 'app'
            binary: office_drive
            window_title: Office Drive
            slug: drive
            journey_script: 'journeys/drive.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_crm
            app_dir: 'app'
            binary: office_crm
            window_title: Office CRM
            slug: crm
            journey_script: 'journeys/crm.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_desk
            app_dir: 'app'
            binary: office_desk
            window_title: Office Desk
            slug: desk
            journey_script: 'journeys/desk.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_books
            app_dir: 'app'
            binary: office_books
            window_title: Office Books
            slug: books
          - app: office_hrms
            app_dir: 'app'
            binary: office_people
            window_title: Office People
            slug: people
            journey_script: 'journeys/people.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_payroll
            app_dir: 'app'
            binary: office_payroll
            window_title: Office Payroll
            slug: payroll
            journey_script: 'journeys/payroll.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_meeting
            app_dir: 'app'
            binary: office_meeting
            window_title: Office Meeting
            slug: meet
          - app: office_team_chat
            app_dir: 'app'
            binary: office_chat
            window_title: Office Chat
            slug: chat
          - app: office_analytics
            app_dir: 'app'
            binary: office_analytics
            window_title: Office Analytics
            slug: analytics
          - app: office_single_auth
            app_dir: 'app'
            binary: office_accounts
            window_title: Office Accounts
            slug: accounts
            journey_script: 'journeys/accounts.ps1'
            ref: 'windows-dashboard-ci'
          - app: office_ai_interface
            app_dir: 'app'
            binary: office_ai
            window_title: Office AI
            slug: ai
          - app: office_vault
            app_dir: 'app'
            binary: office_vault
            window_title: Office Vault
            slug: vault
    uses: ./.github/workflows/reusable-windows-x64-verify.yml
    with:
      app_dir: ${{ matrix.app_dir }}
      binary: ${{ matrix.binary }}
      window_title: ${{ matrix.window_title }}
      repository: jayaanandabalaji/${{ matrix.app }}
      artifact_name: ${{ matrix.slug }}-windows-x64
      deploy_slug: ${{ inputs.deploy && matrix.slug || '' }}
      journey_script: ${{ matrix.journey_script }}
      ref: ${{ matrix.ref }}
    secrets:
      app_repo_token: ${{ secrets.APP_REPO_TOKEN }}
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
